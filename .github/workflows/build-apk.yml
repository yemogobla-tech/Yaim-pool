              archive.extractall(destination)

          candidates = set()
          for name in ('settings.gradle', 'settings.gradle.kts'):
              candidates.update(p.parent for p in destination.rglob(name))
          if not candidates:
              raise SystemExit(
                  'ZIP contains no Android Gradle project (settings.gradle or settings.gradle.kts). '
                  'Add a complete Android project to the ZIP before building.'
              )
          # Prefer the most shallow project with a Gradle wrapper.
          projects = sorted(candidates, key=lambda p: (not (p / 'gradlew').is_file(), len(p.parts), str(p)))
          project = projects[0]
          if not ((project / 'app').is_dir() or (project / 'build.gradle').exists()
                  or (project / 'build.gradle.kts').exists()):
              raise SystemExit(f'Gradle project appears incomplete: {project}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'dir={project}', file=output)
          print(f'Using Android project: {project}')
          PY

      - name: Compile debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo 'No Gradle wrapper found; using installed Gradle 8.7.'
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect generated APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' apks < <(find '${{ steps.project.outputs.dir }}' -type f -path '*/build/outputs/apk/debug/*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then
            echo 'ERROR: Gradle succeeded but no debug APK was found.' >&2
            exit 1
          fi
          count=0
          for apk in "${apks[@]}"; do
            count=$((count + 1))
            cp "$apk" "dist/aimpool-debug-${count}.apk"
            echo "Collected: $apk"
          done
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AimPoolPro-Debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
