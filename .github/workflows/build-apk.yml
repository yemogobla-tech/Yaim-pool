name: Build AimPoolPro APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimpool-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project and validate its structure
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os, stat
          from shutil import copyfile

          archives = sorted(Path('.').glob('*.zip'))
          if len(archives) != 1:
              raise SystemExit(f'Expected exactly one ZIP at repository root; found {len(archives)}: {archives}')

          destination = Path('android-project').resolve()
          destination.mkdir(exist_ok=True)
          with ZipFile(archives[0]) as archive:
              for info in archive.infolist():
                  item = Path(info.filename)
                  mode = info.external_attr >> 16
                  if (item.is_absolute() or '..' in item.parts or
                      stat.S_ISLNK(mode)):
                      raise SystemExit(f'Unsafe ZIP entry: {info.filename}')
                  target = (destination / item).resolve()
                  if not target.is_relative_to(destination):
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
              archive.extractall(destination)

          candidates = set()
          for name in ('settings.gradle', 'settings.gradle.kts'):
              candidates.update(p.parent for p in destination.rglob(name))
          if not candidates:
              raise SystemExit(
                  'ZIP contains no Android Gradle project (settings.gradle or settings.gradle.kts). '
                  'Add a complete Android project to the ZIP before building.'
              )
          # Prefer the most shallow project with a Gradle wrapper.
          projects = sorted(candidates, key=lambda p: (not (p / 'gradlew').is_file(), len(p.parts), str(p)))
          project = projects[0]
          if not ((project / 'app').is_dir() or (project / 'build.gradle').exists()
                  or (project / 'build.gradle.kts').exists()):
              raise SystemExit(f'Gradle project appears incomplete: {project}')
          catalog = project / 'gradle' / 'libs.versions.toml'
          if not catalog.is_file():
              catalog.parent.mkdir(parents=True, exist_ok=True)
              copyfile(Path('gradle/libs.versions.toml'), catalog)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'dir={project}', file=output)
          print(f'Using Android project: {project}')
          PY

      - name: Compile debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo 'No Gradle wrapper found; using installed Gradle 8.7.'
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect generated APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' apks < <(find '${{ steps.project.outputs.dir }}' -type f -path '*/build/outputs/apk/debug/*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then
            echo 'ERROR: Gradle succeeded but no debug APK was found.' >&2
            exit 1
          fi
          count=0
          for apk in "${apks[@]}"; do
            count=$((count + 1))
            cp "$apk" "dist/aimpool-debug-${count}.apk"
            echo "Collected: $apk"
          done
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AimPoolPro-Debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
