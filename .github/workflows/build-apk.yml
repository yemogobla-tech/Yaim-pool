name: Build AimPoolPro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Générer et compiler le projet Android AimPoolPro
        run: |
          set -e
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip || true
          fi

          mkdir -p app/src/main/java/com/aimpool/pro

          cat << 'EOG' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AimPoolPro"
          include(":app")
          EOG

          cat << 'EOG' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOG

          cat << 'EOG' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOG

          cat << 'EOG' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aimpool.pro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aimpool.pro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
                  debug { isDebuggable = true }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOG

          cat << 'EOM' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Aim Pool Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AimOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="billiards_training_guide_overlay" />
                  </service>
              </application>
          </manifest>
          EOM

          cat << 'EOK' > app/src/main/java/com/aimpool/pro/PhysicsEngine2D.kt
          package com.aimpool.pro
          import kotlin.math.*

          object PhysicsEngine2D {
              data class Point(val x: Float, val y: Float) {
                  fun distanceTo(other: Point): Float = hypot(x - other.x, y - other.y)
              }
              data class TableBounds(val left: Float, val top: Float, val right: Float, val bottom: Float, val ballRadius: Float) {
                  val minX: Float get() = left + ballRadius
                  val maxX: Float get() = right - ballRadius
                  val minY: Float get() = top + ballRadius
                  val maxY: Float get() = bottom - ballRadius
              }
              data class RaySegment(val start: Point, val end: Point, val bounceIndex: Int)
              data class ShotPrediction(
                  val cushionSegments: List<RaySegment>,
                  val ghostBallCenter: Point?,
                  val targetBallEnd: Point?,
                  val cueBallDeflectionEnd: Point?
              )

              fun computeShot(cueBall: Point, targetBall: Point, angleRad: Float, maxBounces: Int, spinY: Float, table: TableBounds): ShotPrediction {
                  val segments = mutableListOf<RaySegment>()
                  var curr = cueBall
                  var dx = cos(angleRad)
                  var dy = sin(angleRad)
                  var ghostCenter: Point? = null
                  var targetEnd: Point? = null
                  var cueDeflectEnd: Point? = null

                  for (bounce in 0 until maxBounces.coerceIn(1, 4)) {
                      if (bounce == 0) {
                          val ghost = intersectRayCircle(curr, dx, dy, targetBall, table.ballRadius * 2f)
                          val wallHit = castToCushion(curr, dx, dy, table)
                          if (ghost != null && curr.distanceTo(ghost) <= curr.distanceTo(wallHit.first)) {
                              ghostCenter = ghost
                              segments.add(RaySegment(curr, ghost, bounce))
                              val nx = targetBall.x - ghost.x
                              val ny = targetBall.y - ghost.y
                              val nLen = hypot(nx, ny).coerceAtLeast(1e-4f)
                              val unx = nx / nLen
                              val uny = ny / nLen
                              targetEnd = castToCushion(targetBall, unx, uny, table).first
                              val dot = dx * unx + dy * uny
                              var tx = dx - dot * unx + spinY * 0.35f * unx
                              var ty = dy - dot * uny + spinY * 0.35f * uny
                              val tLen = hypot(tx, ty).coerceAtLeast(1e-4f)
                              tx /= tLen
                              ty /= tLen
                              cueDeflectEnd = Point(ghost.x + tx * (table.ballRadius * 7f), ghost.y + ty * (table.ballRadius * 7f))
                              break
                          }
                      }
                      val (hitPoint, nextDir) = castToCushion(curr, dx, dy, table)
                      segments.add(RaySegment(curr, hitPoint, bounce))
                      curr = hitPoint
                      dx = nextDir.first
                      dy = nextDir.second
                  }
                  return ShotPrediction(segments, ghostCenter, targetEnd, cueDeflectEnd)
              }

              private fun castToCushion(origin: Point, dx: Float, dy: Float, table: TableBounds): Pair<Point, Pair<Float, Float>> {
                  var tMin = Float.MAX_VALUE
                  var nextDx = dx
                  var nextDy = dy
                  if (dx > 1e-5f) {
                      val t = (table.maxX - origin.x) / dx
                      if (t > 1e-3f && t < tMin) { tMin = t; nextDx = -dx; nextDy = dy }
                  } else if (dx < -1e-5f) {
                      val t = (table.minX - origin.x) / dx
                      if (t > 1e-3f && t < tMin) { tMin = t; nextDx = -dx; nextDy = dy }
                  }
                  if (dy > 1e-5f) {
                      val t = (table.maxY - origin.y) / dy
                      if (t > 1e-3f && t < tMin) { tMin = t; nextDx = dx; nextDy = -dy }
                  } else if (dy < -1e-5f) {
                      val t = (table.minY - origin.y) / dy
                      if (t > 1e-3f && t < tMin) { tMin = t; nextDx = dx; nextDy = -dy }
                  }
                  if (tMin == Float.MAX_VALUE) tMin = 0f
                  return Pair(Point(origin.x + dx * tMin, origin.y + dy * tMin), Pair(nextDx, nextDy))
              }

              private fun intersectRayCircle(origin: Point, dx: Float, dy: Float, center: Point, radiusSum: Float): Point? {
                  val fx = origin.x - center.x
                  val fy = origin.y - center.y
                  val b = 2f * (fx * dx + fy * dy)
                  val c = fx * fx + fy * fy - radiusSum * radiusSum
                  val disc = b * b - 4f * c
                  if (disc < 0f) return null
                  val t1 = (-b - sqrt(disc)) * 0.5f
                  return if (t1 > 1e-3f) Point(origin.x + dx * t1, origin.y + dy * t1) else null
              }
          }
          EOK

          cat << 'EOK' > app/src/main/java/com/aimpool/pro/OverlayTrajectoryView.kt
          package com.aimpool.pro
          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*

          class OverlayTrajectoryView(context: Context) : View(context) {
              var bouncesCount: Int = 3
              var angleRad: Float = -0.35f
              var spinY: Float = 0f
              private var initialized = false
              private var cueBall = PhysicsEngine2D.Point(350f, 500f)
              private var targetBall = PhysicsEngine2D.Point(750f, 420f)
              private var draggingMode = 0

              private val tablePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 5f; color = Color.parseColor("#FFB300")
              }
              private val rayPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4.5f; color = Color.WHITE
                  pathEffect = DashPathEffect(floatArrayOf(18f, 12f), 0f)
              }
              private val targetLinePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 5f; color = Color.parseColor("#00E676")
              }
              private val deflectPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4f; color = Color.parseColor("#40C4FF")
              }
              private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#FF6D00")
              }
              private val wheelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4f; color = Color.parseColor("#F59E0B")
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat().coerceAtLeast(800f)
                  val h = height.toFloat().coerceAtLeast(450f)
                  val table = PhysicsEngine2D.TableBounds(w * 0.08f, h * 0.14f, w * 0.86f, h * 0.88f, (h * 0.032f).coerceAtLeast(18f))
                  if (!initialized && width > 0 && height > 0) {
                      cueBall = PhysicsEngine2D.Point(w * 0.30f, h * 0.52f)
                      targetBall = PhysicsEngine2D.Point(w * 0.62f, h * 0.44f)
                      initialized = true
                  }
                  canvas.drawRect(table.left, table.top, table.right, table.bottom, tablePaint)
                  val pred = PhysicsEngine2D.computeShot(cueBall, targetBall, angleRad, bouncesCount, spinY, table)
                  for (seg in pred.cushionSegments) canvas.drawLine(seg.start.x, seg.start.y, seg.end.x, seg.end.y, rayPaint)
                  pred.ghostBallCenter?.let { canvas.drawCircle(it.x, it.y, table.ballRadius, deflectPaint) }
                  pred.targetBallEnd?.let { canvas.drawLine(targetBall.x, targetBall.y, it.x, it.y, targetLinePaint) }
                  pred.cueBallDeflectionEnd?.let {
                      val s = pred.ghostBallCenter ?: cueBall
                      canvas.drawLine(s.x, s.y, it.x, it.y, deflectPaint)
                  }
                  canvas.drawCircle(cueBall.x, cueBall.y, table.ballRadius, rayPaint)
                  canvas.drawCircle(targetBall.x, targetBall.y, table.ballRadius, targetLinePaint)
                  val handleDist = table.ballRadius * 4.2f
                  val buttX = cueBall.x - cos(angleRad) * handleDist
                  val buttY = cueBall.y - sin(angleRad) * handleDist
                  canvas.drawLine(cueBall.x, cueBall.y, buttX, buttY, tablePaint)
                  canvas.drawCircle(buttX, buttY, table.ballRadius * 0.95f, handlePaint)
                  canvas.drawRoundRect(w * 0.91f, h * 0.22f, w * 0.97f, h * 0.78f, 18f, 18f, wheelPaint)
              }

              private var lastY = 0f
              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val x = event.x
                  val y = event.y
                  val buttX = cueBall.x - cos(angleRad) * 80f
                  val buttY = cueBall.y - sin(angleRad) * 80f
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastY = y
                          val p = PhysicsEngine2D.Point(x, y)
                          draggingMode = when {
                              p.distanceTo(cueBall) < 65f -> 1
                              p.distanceTo(targetBall) < 65f -> 2
                              x > width * 0.88f -> 4
                              p.distanceTo(PhysicsEngine2D.Point(buttX, buttY)) < 85f -> 3
                              else -> 3
                          }
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          when (draggingMode) {
                              1 -> { cueBall = PhysicsEngine2D.Point(x, y); angleRad = atan2(targetBall.y - cueBall.y, targetBall.x - cueBall.x) }
                              2 -> { targetBall = PhysicsEngine2D.Point(x, y); angleRad = atan2(targetBall.y - cueBall.y, targetBall.x - cueBall.x) }
                              3 -> { angleRad = atan2(cueBall.y - y, cueBall.x - x) }
                              4 -> { angleRad += (y - lastY) * 0.0008f; lastY = y }
                          }
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { draggingMode = 0; return true }
                  }
                  return super.onTouchEvent(event)
              }
          }
          EOK

          cat << 'EOK' > app/src/main/java/com/aimpool/pro/AimOverlayService.kt
          package com.aimpool.pro
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import androidx.core.app.NotificationCompat

          class AimOverlayService : Service() {
              private var windowManager: WindowManager? = null
              private var trajectoryView: OverlayTrajectoryView? = null
              private var controlBar: LinearLayout? = null
              private var passThrough = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundServiceNotification()
                  if (!Settings.canDrawOverlays(this)) { stopSelf(); return }
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  trajectoryView = OverlayTrajectoryView(this)
                  val overlayParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  windowManager?.addView(trajectoryView, overlayParams)

                  controlBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#CC111827"))
                      setPadding(16, 8, 16, 8)
                      val btnLock = Button(context).apply {
                          text = "Jouer / Tirer"
                          setOnClickListener {
                              passThrough = !passThrough
                              text = if (passThrough) "Ajuster Visée" else "Jouer / Tirer"
                              overlayParams.flags = if (passThrough) {
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                              } else {
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                              }
                              windowManager?.updateViewLayout(trajectoryView, overlayParams)
                          }
                      }
                      val btnClose = Button(context).apply {
                          text = "Fermer"
                          setOnClickListener { stopSelf() }
                      }
                      addView(btnLock)
                      addView(btnClose)
                  }
                  val barParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; y = 16 }
                  windowManager?.addView(controlBar, barParams)
              }

              private fun startForegroundServiceNotification() {
                  val channelId = "aim_pool_overlay_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Aim Pool Pro Guide", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notif = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Aim Pool Pro actif")
                      .setContentText("Guide 3 bandes et molette de précision activés")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .build()
                  startForeground(101, notif)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  trajectoryView?.let { windowManager?.removeView(it) }
                  controlBar?.let { windowManager?.removeView(it) }
              }
          }
          EOK

          cat << 'EOK' > app/src/main/java/com/aimpool/pro/MainActivity.kt
          package com.aimpool.pro
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = FrameLayout(this).apply { setBackgroundColor(Color.parseColor("#0D1321")) }
                  val simulatorView = OverlayTrajectoryView(this)
                  root.addView(simulatorView)
                  val topPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#D9111827"))
                      setPadding(24, 12, 24, 12)
                      val title = TextView(context).apply {
                          text = "AIM POOL PRO (3 Bandes + Molette)"
                          setTextColor(Color.parseColor("#F59E0B"))
                          textSize = 15f
                          setPadding(0, 0, 24, 0)
                      }
                      val btnOverlay = Button(context).apply {
                          text = "Activer Superposition"
                          setOnClickListener {
                              if (!Settings.canDrawOverlays(this@MainActivity)) {
                                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                              } else {
                                  val svc = Intent(this@MainActivity, AimOverlayService::class.java)
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc) else startService(svc)
                              }
                          }
                      }
                      val btnStop = Button(context).apply {
                          text = "Arrêter"
                          setOnClickListener { stopService(Intent(this@MainActivity, AimOverlayService::class.java)) }
                      }
                      addView(title); addView(btnOverlay); addView(btnStop)
                  }
                  root.addView(topPanel, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP))
                  setContentView(root)
              }
          }
          EOK

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: AimPoolPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
